<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قطعات آموزشی موسیقی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #202938;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 800px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: #f1f5f9;
    }

    .collection {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .description {
      margin-top: 8px;
      color: #666;
      line-height: 1.8;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<header>
  <h1>🎵 قطعات آموزشی موسیقی</h1>
</header>

<div class="container">

  <div class="card">

    <h2>📚 دسته‌های آموزشی</h2>

    <div id="status" class="status">
      در حال اتصال به سرور...
    </div>

    <div id="collections"></div>

  </div>

</div>

<script>

const API_URL =
  "https://music-api.dehghaniweb.workers.dev";

async function loadCollections() {

  const status =
    document.getElementById("status");

  const container =
    document.getElementById("collections");

  try {

    const response =
      await fetch(API_URL + "/api/collections");

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const result =
      await response.json();

    console.log("API:", result);

    if (!result.ok) {
      throw new Error(
        "API پاسخ موفق برنگرداند."
      );
    }

    status.innerHTML =
      "✅ اتصال به سرور موفق بود.";

    if (
      !result.data ||
      result.data.length === 0
    ) {

      container.innerHTML =
        "<p>هنوز دسته‌ای ثبت نشده است.</p>";

      return;
    }

    container.innerHTML = "";

    result.data.forEach(function(collection) {

      const box =
        document.createElement("div");

      box.className =
        "collection";

      box.innerHTML = `
        <div class="title">
          📁 ${escapeHtml(collection.title)}
        </div>

        <div class="description">
          ${escapeHtml(
            collection.description || "بدون توضیحات"
          )}
        </div>
      `;

      container.appendChild(box);

    });

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "❌ اتصال به سرور انجام نشد.";

    container.innerHTML = `
      <div class="error">
        <strong>خطا:</strong><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value == null ? "" : value;

  return div.innerHTML;
}


loadCollections();

</script>

</body>
</html>
