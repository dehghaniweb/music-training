<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قطعات آموزشی موسیقی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    header {
      background: white;
      border-radius: 16px;
      padding: 25px 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 11px 17px;
      font-size: 14px;
      background: #1976d2;
      color: white;
    }

    .btn:hover {
      opacity: .9;
    }

    .btn.secondary {
      background: #607d8b;
    }

    .btn.success {
      background: #2e7d32;
    }

    .btn.danger {
      background: #c62828;
    }

    .btn.warning {
      background: #ef6c00;
    }

    .btn.light {
      background: #eceff1;
      color: #222;
    }

    .status {
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
    }

    .section {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    .section-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .collection {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .collection-title {
      font-size: 19px;
      font-weight: bold;
    }

    .description {
      color: #666;
      margin-top: 7px;
      line-height: 1.8;
    }

    .pieces {
      margin-top: 15px;
    }

    .piece {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }

    .piece-header {
      padding: 14px;
      cursor: pointer;
    }

    .piece-header:hover {
      background: #f1f5f9;
    }

    .piece-title {
      font-weight: bold;
      font-size: 17px;
    }

    .piece-details {
      display: none;
      border-top: 1px solid #ddd;
      padding: 15px;
      background: white;
    }

    .piece-details.show {
      display: block;
    }

    .file-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      background: #fafafa;
    }

    .file-title {
      font-weight: bold;
      margin-bottom: 7px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .file-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .empty {
      color: #888;
      padding: 10px 0;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .hidden {
      display: none !important;
    }

    .admin-box {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.07);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .admin-item {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .admin-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .small {
      font-size: 13px;
      color: #777;
    }

    .login-box {
      max-width: 500px;
      margin: 0 auto;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow: auto;
      border-radius: 15px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close {
      border: 0;
      background: #eee;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      font-size: 18px;
    }

    .footer {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .container {
        padding: 12px;
      }

      header h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <h1>🎵 قطعات آموزشی موسیقی</h1>

    <p>
      آموزش، قطعات صوتی و فایل‌های آموزشی
    </p>

    <div class="top-buttons">

      <button
        class="btn"
        onclick="showPublic()"
      >
        🏠 صفحه اصلی
      </button>

      <button
        class="btn secondary"
        onclick="showAdmin()"
      >
        🔐 مدیریت
      </button>

    </div>

  </header>


  <div
    id="status"
    class="status"
  >
    ⏳ در حال اتصال به سرور...
  </div>


  <!-- =====================================================
       PUBLIC
  ====================================================== -->

  <div id="publicPage">

    <div class="section">

      <div class="section-title">
        📚 دسته‌های آموزشی
      </div>

      <div id="collections">
        <div class="loading">
          در حال دریافت اطلاعات...
        </div>
      </div>

    </div>

  </div>


  <!-- =====================================================
       ADMIN LOGIN
  ====================================================== -->

  <div
    id="adminLogin"
    class="section hidden"
  >

    <div class="login-box">

      <div class="section-title">
        🔐 ورود به مدیریت
      </div>

      <div class="field">

        <label>
          کلید مدیریت
        </label>

        <input
          id="adminKeyInput"
          type="password"
          placeholder="ADMIN_KEY"
        >

      </div>

      <button
        class="btn success"
        onclick="loginAdmin()"
      >
        ورود
      </button>

      <p class="small">
        کلید مدیریت فقط در همین مرورگر استفاده می‌شود.
      </p>

    </div>

  </div>


  <!-- =====================================================
       ADMIN PANEL
  ====================================================== -->

  <div
    id="adminPanel"
    class="hidden"
  >

    <div class="admin-box">

      <div class="section-title">
        ⚙️ پنل مدیریت
      </div>

      <div class="top-buttons">

        <button
          class="btn success"
          onclick="openCollectionModal()"
        >
          ➕ افزودن دسته
        </button>

        <button
          class="btn"
          onclick="openPieceModal()"
        >
          ➕ افزودن قطعه
        </button>

        <button
          class="btn secondary"
          onclick="loadAdminData()"
        >
          🔄 بروزرسانی
        </button>

        <button
          class="btn danger"
          onclick="logoutAdmin()"
        >
          خروج
        </button>

      </div>

    </div>


    <div class="admin-box">

      <div class="section-title">
        📚 مدیریت محتوا
      </div>

      <div id="adminContent">
        <div class="loading">
          در حال دریافت اطلاعات...
        </div>
      </div>

    </div>

  </div>


  <div class="footer">
    سیستم آموزش موسیقی
  </div>

</div>


<!-- =======================================================
     MODAL
======================================================== -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-content">

    <div class="modal-header">

      <h3 id="modalTitle">
        مدیریت
      </h3>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <div id="modalBody"></div>

  </div>

</div>


<script>

const API =
  "https://music-api.dehghaniweb.workers.dev";

let adminKey =
  sessionStorage.getItem("music_admin_key") || "";


// ==========================================================
// STATUS
// ==========================================================

function setStatus(message, error = false) {

  const box =
    document.getElementById("status");

  box.textContent = message;

  box.classList.toggle(
    "error",
    error
  );
}


// ==========================================================
// HTML ESCAPE
// ==========================================================

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


// ==========================================================
// API
// ==========================================================

async function api(
  path,
  options = {},
  authenticated = false
) {

  const headers =
    new Headers(
      options.headers || {}
    );

  if (
    authenticated &&
    adminKey
  ) {

    headers.set(
      "Authorization",
      "Bearer " + adminKey
    );
  }

  const response =
    await fetch(
      API + path,
      {
        ...options,
        headers
      }
    );

  let data;

  try {
    data =
      await response.json();
  } catch {
    throw new Error(
      "پاسخ نامعتبر از سرور"
    );
  }

  if (!response.ok || data.ok === false) {

    throw new Error(
      data.error ||
      "خطا در ارتباط با سرور"
    );
  }

  return data;
}


// ==========================================================
// PAGE SWITCH
// ==========================================================

function showPublic() {

  document
    .getElementById("publicPage")
    .classList.remove("hidden");

  document
    .getElementById("adminLogin")
    .classList.add("hidden");

  document
    .getElementById("adminPanel")
    .classList.add("hidden");

  loadCollections();
}


function showAdmin() {

  document
    .getElementById("publicPage")
    .classList.add("hidden");

  if (adminKey) {

    document
      .getElementById("adminLogin")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    loadAdminData();

  } else {

    document
      .getElementById("adminLogin")
      .classList.remove("hidden");

    document
      .getElementById("adminPanel")
      .classList.add("hidden");

  }

}


// ==========================================================
// PUBLIC: COLLECTIONS
// ==========================================================

async function loadCollections() {

  const container =
    document.getElementById(
      "collections"
    );

  container.innerHTML =
    `<div class="loading">
      ⏳ در حال دریافت دسته‌ها...
    </div>`;

  try {

    const result =
      await api(
        "/api/collections"
      );

    setStatus(
      "✅ اتصال به سرور موفق بود."
    );

    container.innerHTML = "";

    if (
      !result.data ||
      result.data.length === 0
    ) {

      container.innerHTML =
        `<div class="empty">
          هنوز دسته‌ای ثبت نشده است.
        </div>`;

      return;
    }


    for (
      const collection of result.data
    ) {

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "collection";

      box.innerHTML = `

        <div class="collection-title">
          📁 ${escapeHtml(collection.title)}
        </div>

        <div class="description">
          ${escapeHtml(
            collection.description || ""
          )}
        </div>

        <div class="pieces">
          <div class="small">
            🎼 قطعات
          </div>

          <div id="pieces-${collection.id}">
            <div class="loading">
              در حال دریافت...
            </div>
          </div>
        </div>
      `;

      container.appendChild(box);

      loadPieces(
        collection.id,
        box.querySelector(
          "#pieces-" +
          collection.id
        )
      );
    }

  } catch (error) {

    console.error(error);

    setStatus(
      "❌ " + error.message,
      true
    );

    container.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;
  }
}


// ==========================================================
// PUBLIC: PIECES
// ==========================================================

async function loadPieces(
  collectionId,
  container
) {

  try {

    const result =
      await api(
        "/api/collections/" +
        collectionId +
        "/pieces"
      );

    container.innerHTML = "";

    if (
      !result.data ||
      result.data.length === 0
    ) {

      container.innerHTML =
        `<div class="empty">
          هنوز قطعه‌ای ثبت نشده است.
        </div>`;

      return;
    }


    for (
      const piece of result.data
    ) {

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "piece";

      box.innerHTML = `

        <div
          class="piece-header"
          onclick="togglePiece(
            ${piece.id},
            this
          )"
        >

          <div class="piece-title">
            🎵 ${escapeHtml(piece.title)}
          </div>

          <div class="description">
            ${escapeHtml(
              piece.description || ""
            )}
          </div>

        </div>

        <div
          id="piece-details-${piece.id}"
          class="piece-details"
        >
          ⏳ در حال دریافت جزئیات...
        </div>

      `;

      container.appendChild(box);
    }

  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;
  }
}


// ==========================================================
// PUBLIC: PIECE DETAILS
// ==========================================================

async function togglePiece(
  pieceId,
  header
) {

  const details =
    document.getElementById(
      "piece-details-" +
      pieceId
    );

  if (
    details.classList.contains("show")
  ) {

    details.classList.remove("show");

    return;
  }

  details.classList.add("show");

  try {

    const result =
      await api(
        "/api/pieces/" +
        pieceId
      );

    const piece =
      result.data;

    let html = "";

    html += `

      <div>
        <strong>📝 توضیحات</strong>

        <div class="description">
          ${escapeHtml(
            piece.description ||
            "توضیحی ثبت نشده است."
          )}
        </div>
      </div>

    `;


    // AUDIO

    html += `
      <div style="margin-top:18px;">
        <strong>
          🎧 فایل‌های صوتی
        </strong>
      </div>
    `;


    if (
      piece.audio_files &&
      piece.audio_files.length
    ) {

      for (
        const audio of
        piece.audio_files
      ) {

        const fileUrl =
          API +
          "/api/files/audio/" +
          audio.id;

        if (
          audio.file_type === "mp3"
        ) {

          html += `

            <div class="file-card">

              <div class="file-title">
                🎵 ${escapeHtml(
                  audio.title
                )}
              </div>

              <div class="description">
                ${escapeHtml(
                  audio.description || ""
                )}
              </div>

              <audio
                controls
                preload="none"
                src="${fileUrl}"
              ></audio>

            </div>

          `;

        } else {

          html += `

            <div class="file-card">

              <div class="file-title">
                🎵 ${escapeHtml(
                  audio.title
                )}
              </div>

              <div class="description">
                ${escapeHtml(
                  audio.description || ""
                )}
              </div>

              <div class="file-buttons">

                <a
                  class="btn"
                  href="${fileUrl}"
                  target="_blank"
                >
                  ▶️ باز کردن فایل WAV
                </a>

                <a
                  class="btn secondary"
                  href="${fileUrl}"
                  download
                >
                  ⬇️ دانلود
                </a>

              </div>

            </div>

          `;
        }
      }

    } else {

      html += `
        <div class="empty">
          هنوز فایل صوتی ثبت نشده است.
        </div>
      `;
    }


    // PDF

    html += `
      <div style="margin-top:18px;">
        <strong>
          📄 فایل‌های PDF
        </strong>
      </div>
    `;


    if (
      piece.documents &&
      piece.documents.length
    ) {

      for (
        const doc of
        piece.documents
      ) {

        const fileUrl =
          API +
          "/api/files/document/" +
          doc.id;

        html += `

          <div class="file-card">

            <div class="file-title">
              📄 ${escapeHtml(
                doc.title
              )}
            </div>

            <div class="description">
              ${escapeHtml(
                doc.description || ""
              )}
            </div>

            <div class="file-buttons">

              <a
                class="btn"
                href="${fileUrl}"
                target="_blank"
              >
                📖 مشاهده PDF
              </a>

              <a
                class="btn secondary"
                href="${fileUrl}"
                download
              >
                ⬇️ دانلود PDF
              </a>

            </div>

          </div>

        `;
      }

    } else {

      html += `
        <div class="empty">
          هنوز فایل PDF ثبت نشده است.
        </div>
      `;
    }


    details.innerHTML = html;

  } catch (error) {

    details.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;
  }
}


// ==========================================================
// ADMIN LOGIN
// ==========================================================

async function loginAdmin() {

  const input =
    document.getElementById(
      "adminKeyInput"
    );

  const key =
    input.value.trim();

  if (!key) {

    setStatus(
      "❌ کلید مدیریت را وارد کنید.",
      true
    );

    return;
  }

  try {

    const oldKey =
      adminKey;

    adminKey =
      key;

    // تست دسترسی

    await api(
      "/api/collections",
      {},
      true
    );

    sessionStorage.setItem(
      "music_admin_key",
      key
    );

    setStatus(
      "✅ ورود مدیر موفق بود."
    );

    document
      .getElementById(
        "adminLogin"
      )
      .classList.add("hidden");

    document
      .getElementById(
        "adminPanel"
      )
      .classList.remove("hidden");

    loadAdminData();

  } catch (error) {

    adminKey =
      "";

    sessionStorage.removeItem(
      "music_admin_key"
    );

    setStatus(
      "❌ کلید مدیریت صحیح نیست یا دسترسی وجود ندارد.",
      true
    );
  }
}


// ==========================================================
// LOGOUT
// ==========================================================

function logoutAdmin() {

  adminKey =
    "";

  sessionStorage.removeItem(
    "music_admin_key"
  );

  showPublic();

  setStatus(
    "از پنل مدیریت خارج شدید."
  );
}


// ==========================================================
// ADMIN DATA
// ==========================================================

async function loadAdminData() {

  const container =
    document.getElementById(
      "adminContent"
    );

  container.innerHTML =
    `<div class="loading">
      ⏳ در حال دریافت اطلاعات...
    </div>`;

  try {

    const result =
      await api(
        "/api/collections",
        {},
        true
      );

    container.innerHTML = "";

    if (
      !result.data ||
      !result.data.length
    ) {

      container.innerHTML =
        `<div class="empty">
          هنوز دسته‌ای وجود ندارد.
        </div>`;

      return;
    }


    for (
      const collection of result.data
    ) {

      const box =
        document.createElement(
          "div"
        );

      box.className =
        "admin-item";

      box.innerHTML = `

        <strong>
          📁 ${escapeHtml(
            collection.title
          )}
        </strong>

        <div class="small">
          ${escapeHtml(
            collection.description || ""
          )}
        </div>

        <div class="admin-actions">

          <button
            class="btn warning"
            onclick='editCollection(
              ${JSON.stringify(
                collection
              )}
            )'
          >
            ✏️ ویرایش
          </button>

          <button
            class="btn danger"
            onclick="deleteCollection(
              ${collection.id}
            )"
          >
            🗑 حذف
          </button>

          <button
            class="btn"
            onclick="openPieceModal(
              ${collection.id}
            )"
          >
            ➕ افزودن قطعه
          </button>

        </div>

        <div
          id="admin-pieces-${collection.id}"
          style="margin-top:15px;"
        >
          ⏳ قطعات...
        </div>

      `;

      container.appendChild(box);

      loadAdminPieces(
        collection.id,
        box.querySelector(
          "#admin-pieces-" +
          collection.id
        )
      );
    }

  } catch (error) {

    container.innerHTML =
      `<div class="empty">
        ❌ ${escapeHtml(error.message)}
      </div>`;
  }
}


// ==========================================================
// ADMIN PIECES
// ==========================================================

async function loadAdminPieces(
  collectionId,
  container
) {

  try {

    const result =
      await api(
        "/api/collections/" +
        collectionId +
        "/pieces",
        {},
        true
      );

    container.innerHTML = "";

    if (
      !result.data ||
      !result.data.length
    ) {

      container.innerHTML =
        `<div class="small">
          هنوز قطعه‌ای ثبت نشده است.
        </div>`;

      return;
    }


    for (
      const piece of result.data
    ) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "admin-item";

      div.innerHTML = `

        <strong>
          🎵 ${escapeHtml(
            piece.title
          )}
        </strong>

        <div class="small">
          ${escapeHtml(
            piece.description || ""
          )}
        </div>

        <div class="admin-actions">

          <button
            class="btn warning"
            onclick='editPiece(
              ${JSON.stringify(
                piece
              )}
            )'
          >
            ✏️ ویرایش
          </button>

          <button
            class="btn danger"
            onclick="deletePiece(
              ${piece.id}
            )"
          >
            🗑 حذف
          </button>

          <button
            class="btn success"
            onclick="openUploadModal(
              ${piece.id}
            )"
          >
            📤 افزودن فایل
          </button>

          <button
            class="btn secondary"
            onclick="manageFiles(
              ${piece.id}
            )"
          >
            📂 فایل‌ها
          </button>

        </div>

      `;

      container.appendChild(div);
    }

  } catch (error) {

    container.innerHTML =
      `<div class="small">
        ❌ ${escapeHtml(error.message)}
      </div>`;
  }
}


// ==========================================================
// COLLECTION MODAL
// ==========================================================

function openCollectionModal(
  collection = null
) {

  const editing =
    Boolean(collection);

  document.getElementById(
    "modalTitle"
  ).textContent =
    editing
      ? "✏️ ویرایش دسته"
      : "➕ افزودن دسته";

  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <div class="field">

      <label>
        عنوان دسته
      </label>

      <input
        id="collectionTitle"
        value="${escapeHtml(
          collection?.title || ""
        )}"
      >

    </div>

    <div class="field">

      <label>
        توضیحات
      </label>

      <textarea
        id="collectionDescription"
      >${escapeHtml(
        collection?.description || ""
      )}</textarea>

    </div>

    <div class="field">

      <label>
        ترتیب
      </label>

      <input
        id="collectionSort"
        type="number"
        value="${collection?.sort_order || 0}"
      >

    </div>

    <button
      class="btn success"
      onclick="${
        editing
          ? `saveCollection(${collection.id})`
          : `createCollection()`
      }"
    >
      💾 ذخیره
    </button>

  `;

  openModal();
}


function editCollection(
  collection
) {
  openCollectionModal(
    collection
  );
}


// ==========================================================
// CREATE COLLECTION
// ==========================================================

async function createCollection() {

  const title =
    document.getElementById(
      "collectionTitle"
    ).value.trim();

  const description =
    document.getElementById(
      "collectionDescription"
    ).value.trim();

  const sort_order =
    Number(
      document.getElementById(
        "collectionSort"
      ).value || 0
    );

  if (!title) {

    alert(
      "عنوان دسته را وارد کنید."
    );

    return;
  }

  try {

    await api(
      "/api/collections",
      {
        method: "POST",
        headers: {
          "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
          title,
          description,
          sort_order
        })
      },
      true
    );

    closeModal();

    setStatus(
      "✅ دسته با موفقیت ایجاد شد."
    );

    loadAdminData();

  } catch (error) {

    alert(
      error.message
    );
  }
}

// ==========================================================
// PIECE MODAL
// ==========================================================

async function openPieceModal(
  collectionId = null,
  piece = null
) {

  let collections;

  try {

    const result =
      await api(
        "/api/collections",
        {},
        true
      );

    collections =
      result.data;

  } catch (error) {

    alert(
      error.message
    );

    return;
  }


  const editing =
    Boolean(piece);

  document.getElementById(
    "modalTitle"
  ).textContent =
    editing
      ? "✏️ ویرایش قطعه"
      : "➕ افزودن قطعه";


  const options =
    collections
      .map(c => `
        <option
          value="${c.id}"
          ${
            Number(
              piece?.collection_id ??
              collectionId
            ) === Number(c.id)
              ? "selected"
              : ""
          }
        >
          ${escapeHtml(c.title)}
        </option>
      `)
      .join("");


  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <div class="field">

      <label>
        دسته
      </label>

      <select id="pieceCollection">
        ${options}
      </select>

    </div>

    <div class="field">

      <label>
        عنوان قطعه
      </label>

      <input
        id="pieceTitle"
        value="${escapeHtml(
          piece?.title || ""
        )}"
      >

    </div>

    <div class="field">

      <label>
        توضیحات
      </label>

      <textarea
        id="pieceDescription"
      >${escapeHtml(
        piece?.description || ""
      )}</textarea>

    </div>

    <div class="field">

      <label>
        ترتیب
      </label>

      <input
        id="pieceSort"
        type="number"
        value="${piece?.sort_order || 0}"
      >

    </div>

    <button
      class="btn success"
      onclick="${
        editing
          ? `savePiece(${piece.id})`
          : `createPiece()`
      }"
    >
      💾 ذخیره
    </button>

  `;

  openModal();
}


function editPiece(
  piece
) {
  openPieceModal(
    null,
    piece
  );
}

// ==========================================================
// UPLOAD MODAL
// ==========================================================

function openUploadModal(
  pieceId
) {

  document.getElementById(
    "modalTitle"
  ).textContent =
    "📤 افزودن فایل";


  document.getElementById(
    "modalBody"
  ).innerHTML = `

    <div class="field">

      <label>
        عنوان فایل
      </label>

      <input
        id="uploadTitle"
        placeholder="مثلاً آموزش شماره ۱"
      >

    </div>

    <div class="field">

      <label>
        توضیحات
      </label>

      <textarea
        id="uploadDescription"
        placeholder="توضیحات مربوط به این فایل..."
      ></textarea>

    </div>

    <div class="field">

      <label>
        فایل
      </label>

      <input
        id="uploadFile"
        type="file"
        accept=".mp3,.wav,.pdf,audio/mpeg,audio/wav,application/pdf"
      >

      <div class="small">
        فرمت‌های مجاز: MP3، WAV، PDF — حداکثر 20MB
      </div>

    </div>

    <button
      class="btn success"
      onclick="uploadFile(${pieceId})"
    >
      📤 آپلود
    </button>

  `;

  openModal();
}


// ==========================================================
// UPLOAD
// ==========================================================

async function uploadFile(
  pieceId
) {

  const fileInput =
    document.getElementById(
      "uploadFile"
    );

  const file =
    fileInput.files[0];

  if (!file) {

    alert(
      "لطفاً فایل را انتخاب کنید."
    );

    return;
  }


  if (
    file.size >
    20 * 1024 * 1024
  ) {

    alert(
      "حجم فایل نباید بیشتر از 20MB باشد."
    );

    return;
  }


  const title =
    document.getElementById(
      "uploadTitle"
    ).value.trim();

  const description =
    document.getElementById(
      "uploadDescription"
    ).value.trim();


  const formData =
    new FormData();

  formData.append(
    "piece_id",
    pieceId
  );

  formData.append(
    "title",
    title
  );

  formData.append(
    "description",
    description
  );

  formData.append(
    "file",
    file
  );


  try {

    setStatus(
      "⏳ فایل در حال آپلود است..."
    );


    const result =
      await api(
        "/api/admin/upload",
        {
          method: "POST",
          body: formData
        },
        true
      );


    closeModal();


    setStatus(
      "✅ فایل با موفقیت آپلود شد."
    );


    alert(
      "فایل با موفقیت ذخیره شد."
    );


    loadAdminData();

  } catch (error) {

    alert(
      "خطا در آپلود: " +
      error.message
    );
  }
}


// ==========================================================
// MANAGE FILES
// ==========================================================

async function manageFiles(
  pieceId
) {

  try {

    const result =
      await api(
        "/api/pieces/" +
        pieceId
      );

    const piece =
      result.data;


    let html = `

      <div class="description">
        مدیریت فایل‌های:
        <strong>
          ${escapeHtml(
            piece.title
          )}
        </strong>
      </div>

    `;


    html += `
      <h4>🎧 فایل‌های صوتی</h4>
    `;


    if (
      piece.audio_files &&
      piece.audio_files.length
    ) {

      for (
        const audio of
        piece.audio_files
      ) {

        html += `

          <div class="admin-item">

            <strong>
              🎵 ${escapeHtml(
                audio.title
              )}
            </strong>

            <div class="small">
              ${escapeHtml(
                audio.description || ""
              )}
            </div>

            <div class="admin-actions">

              <button
                class="btn danger"
                onclick="deleteAudio(
                  ${audio.id},
                  ${pieceId}
                )"
              >
                🗑 حذف
              </button>

            </div>

          </div>
        `;
      }

    } else {

      html += `
        <div class="empty">
          فایل صوتی وجود ندارد.
        </div>
      `;
    }


    html += `
      <h4 style="margin-top:20px;">
        📄 فایل‌های PDF
      </h4>
    `;


    if (
      piece.documents &&
      piece.documents.length
    ) {

      for (
        const doc of
        piece.documents
      ) {

        html += `

          <div class="admin-item">

            <strong>
              📄 ${escapeHtml(
                doc.title
              )}
            </strong>

            <div class="small">
              ${escapeHtml(
                doc.description || ""
              )}
            </div>

            <div class="admin-actions">

              <button
                class="btn"
                onclick="window.open(
                  '${API}/api/files/document/${doc.id}',
                  '_blank'
                )"
              >
                📖 مشاهده
              </button>

              <button
                class="btn danger"
                onclick="deleteDocument(
                  ${doc.id},
                  ${pieceId}
                )"
              >
                🗑 حذف
              </button>

            </div>

          </div>
        `;
      }

    } else {

      html += `
        <div class="empty">
          فایل PDF وجود ندارد.
        </div>
      `;
    }


    document.getElementById(
      "modalTitle"
    ).textContent =
      "📂 فایل‌های قطعه";


    document.getElementById(
      "modalBody"
    ).innerHTML =
      html;


    openModal();

  } catch (error) {

    alert(
      error.message
    );
  }
}
