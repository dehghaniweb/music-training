<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت قطعات آموزشی موسیقی</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6f8;
    color:#222;
}

header{
    background:#202938;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:22px;
}

.container{
    max-width:1000px;
    margin:30px auto;
    padding:0 15px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    font-size:19px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-size:14px;
}

.primary{
    background:#2563eb;
    color:white;
}

.success{
    background:#16a34a;
    color:white;
}

.danger{
    background:#dc2626;
    color:white;
}

input,textarea,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-top:7px;
    margin-bottom:15px;
    font-family:inherit;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.item{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    margin-top:12px;
}

.item-title{
    font-weight:bold;
    font-size:16px;
}

.actions{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.file-box{
    border:2px dashed #ccc;
    border-radius:10px;
    padding:20px;
    text-align:center;
    margin-bottom:15px;
}

@media(max-width:700px){
    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎵 مدیریت قطعات آموزشی موسیقی</h1>
</header>

<div class="container">

    <div class="card">
        <h2>📚 دسته‌های آموزشی</h2>

        <div class="item">
            <div class="item-title">
                کوک دو سل دو
            </div>

            <div class="actions">
                <button class="primary">
                    مشاهده قطعات
                </button>

                <button class="success">
                    + افزودن قطعه
                </button>
            </div>
        </div>
    </div>


    <div class="card">

        <h2>➕ افزودن قطعه آموزشی</h2>

        <label>
            عنوان قطعه
        </label>

        <input
            type="text"
            placeholder="مثلاً: کوک دو سل دو دو"
        >

        <label>
            توضیحات
        </label>

        <textarea
            placeholder="توضیحات مربوط به این قطعه..."
        ></textarea>

        <div class="file-box">

            🎵 فایل صوتی

            <br><br>

            <input
                type="file"
                accept=".mp3,.wav"
            >

        </div>

        <div class="file-box">

            📄 فایل PDF

            <br><br>

            <input
                type="file"
                accept=".pdf"
            >

        </div>

        <button class="success">
            ذخیره قطعه
        </button>

    </div>


    <div class="card">

        <h2>🎼 قطعات موجود</h2>

        <div class="item">

            <div class="item-title">
                کوک دو سل دو دو
            </div>

            <p>
                توضیحات قطعه آموزشی
            </p>

            <div class="actions">

                <button class="primary">
                    ✏️ ویرایش
                </button>

                <button class="danger">
                    🗑️ حذف
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
